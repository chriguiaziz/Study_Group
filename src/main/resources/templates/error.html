<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('Error')}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: topbar}"></div>
<main class="auth-page">
    <section class="card auth-card">
        <span class="badge orange">Something went wrong</span>
        <h1>Application Error</h1>
        <p class="muted">The requested action could not be completed.</p>
        <a class="button" th:href="@{/dashboard}">Back to dashboard</a>
        <a class="button secondary" th:href="@{/}">Home</a>
    </section>
</main>
</body>
</html>
